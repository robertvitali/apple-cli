name: CI

on:
  push:
    branches: [main]         # repo-local main-only workflow
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Least privilege: the build/test job needs only read access to repo contents.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain-policy:
    name: Supply-chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.27"
          enable-cache: false

      - name: Validate supply-chain policy
        run: |
          set -euo pipefail
          python -m unittest discover -s Tests/automation -p 'test_*.py'
          python scripts/ci/action_pins.py
          python scripts/ci/dependency_policy.py

      - name: Prove documentation lock closure
        run: |
          set -euo pipefail
          uv pip compile docs/requirements.in --python-version 3.12 --python-platform x86_64-unknown-linux-gnu --generate-hashes --output-file docs/requirements.txt
          git diff --exit-code -- docs/requirements.txt
          python -m pip install --require-hashes -r docs/requirements.txt

  build-test:
    # GitHub-hosted macOS runners ship full Xcode, so swift-testing is available here.
    # Hosted-runner minutes are free only while this repo is public; metered whenever it is private. Uses
    # The unprivileged pull-request event gives forked PRs a read-only token and no secrets.
    # While public, fork PRs execute untrusted code (Package.swift manifests, test bodies) on these
    # runners; the read-only token bounds that to compute abuse. Keep "require approval for
    # outside-contributor runs" enabled in repo Actions settings.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      # The pull-request quality driver comes from the exact trusted base commit;
      # candidate code remains in the original read-only-token checkout.
      - name: Prepare trusted policy checkout
        if: github.event_name == 'pull_request'
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_OPTIONAL_LOCKS: "0"
          LC_ALL: C
        run: |
          set -euo pipefail
          /usr/bin/git \
            -c core.fsmonitor=false \
            -c core.hooksPath=/dev/null \
            -c credential.helper= \
            -c credential.interactive=never \
            worktree add --detach \
            "$RUNNER_TEMP/trusted-policy" \
            "${{ github.event.pull_request.base.sha }}"

      - name: Run hosted quality (pull request)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/trusted-policy/scripts/ci/quality.py" \
            --mode hosted \
            --hosted-context pull-request \
            --hosted-phase swift \
            --candidate-root "$GITHUB_WORKSPACE" \
            --candidate-sha "${{ github.event.pull_request.head.sha }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}"

      - name: Run hosted quality (trusted ref)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          python3 scripts/ci/quality.py \
            --mode hosted \
            --hosted-context trusted-ref \
            --hosted-phase swift \
            --candidate-root "$GITHUB_WORKSPACE" \
            --candidate-sha "${{ github.sha }}"

  hosted-bats-build:
    # Separate runner from hosted-bats: PR-controlled Swift build code cannot mutate the
    # trusted policy checkout or pinned Bats executable used by the hosted Bats partition.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      # The pull-request quality driver comes from the exact trusted base commit;
      # candidate code remains in the original read-only-token checkout.
      - name: Prepare trusted policy checkout
        if: github.event_name == 'pull_request'
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_OPTIONAL_LOCKS: "0"
          LC_ALL: C
        run: |
          set -euo pipefail
          /usr/bin/git \
            -c core.fsmonitor=false \
            -c core.hooksPath=/dev/null \
            -c credential.helper= \
            -c credential.interactive=never \
            worktree add --detach \
            "$RUNNER_TEMP/trusted-policy" \
            "${{ github.event.pull_request.base.sha }}"

      - name: Build candidate for hosted Bats (pull request)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/trusted-policy/scripts/ci/quality.py" \
            --mode hosted \
            --hosted-context pull-request \
            --hosted-phase build \
            --candidate-root "$GITHUB_WORKSPACE" \
            --candidate-sha "${{ github.event.pull_request.head.sha }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}"

      - name: Build candidate for hosted Bats (trusted ref)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          python3 scripts/ci/quality.py \
            --mode hosted \
            --hosted-context trusted-ref \
            --hosted-phase build \
            --candidate-root "$GITHUB_WORKSPACE" \
            --candidate-sha "${{ github.sha }}"

      - name: Package hosted Bats binary artifact
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/hosted-bats-artifact"
          mkdir -p "$artifact_dir"
          binary_path="$(swift build --show-bin-path)/apple"
          [ -x "$binary_path" ] || { echo "Built apple binary is unavailable."; exit 1; }
          upstream_root="$(cd "$(dirname "$binary_path")/../.." && pwd -P)"
          upstream_matcher="$upstream_root/checkouts/swift-argument-parser/Sources/ArgumentParser/Utilities/Tree.swift"
          [ -f "$upstream_matcher" ] || { echo "Swift ArgumentParser matcher source is unavailable."; exit 1; }
          cp "$binary_path" "$artifact_dir/apple"
          chmod 755 "$artifact_dir/apple"
          mkdir -p "$artifact_dir/upstream-root/checkouts/swift-argument-parser/Sources/ArgumentParser/Utilities"
          cp "$upstream_matcher" "$artifact_dir/upstream-root/checkouts/swift-argument-parser/Sources/ArgumentParser/Utilities/Tree.swift"
          (cd "$artifact_dir" && shasum -a 256 apple upstream-root/checkouts/swift-argument-parser/Sources/ArgumentParser/Utilities/Tree.swift > apple.sha256)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-bats-apple-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-bats-artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  hosted-bats:
    # Runs on a fresh runner after hosted-bats-build. The only cross-job input is the
    # candidate binary artifact, which is untrusted and exercised by hosted-safe Bats tests.
    needs: hosted-bats-build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      # The pull-request quality driver comes from the exact trusted base commit;
      # candidate code remains in the original read-only-token checkout.
      - name: Prepare trusted policy checkout
        if: github.event_name == 'pull_request'
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_OPTIONAL_LOCKS: "0"
          LC_ALL: C
        run: |
          set -euo pipefail
          /usr/bin/git \
            -c core.fsmonitor=false \
            -c core.hooksPath=/dev/null \
            -c credential.helper= \
            -c credential.interactive=never \
            worktree add --detach \
            "$RUNNER_TEMP/trusted-policy" \
            "${{ github.event.pull_request.base.sha }}"

      - name: Install pinned Bats
        env:
          BATS_INTEGRITY: sha512-giSYKGTOcPZyJDbfbTtzAedLcNWdjCLbXYU3/MwPnjyvDXzu6Dgw8d2M+8jHhZXSmsCMSQqCp+YBsJ603UO4vQ==
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_USERCONFIG: /dev/null
        run: |
          set -euo pipefail
          npm_global_config="$(mktemp "$RUNNER_TEMP/npm-globalrc.XXXXXX")"
          chmod 400 "$npm_global_config"
          trap 'rm -f "$npm_global_config"' EXIT
          export NPM_CONFIG_GLOBALCONFIG="$npm_global_config"
          cd "$RUNNER_TEMP"
          tarball="$RUNNER_TEMP/bats-1.13.0.tgz"
          npm pack bats@1.13.0 --pack-destination "$RUNNER_TEMP" --ignore-scripts >/dev/null
          [ -f "$tarball" ] || { echo "Pinned Bats tarball was not downloaded."; exit 1; }
          ACTUAL_INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
          if [ "$ACTUAL_INTEGRITY" != "$BATS_INTEGRITY" ]; then
            echo "Pinned Bats integrity mismatch."
            exit 1
          fi
          npm install --ignore-scripts --no-audit --no-fund "$tarball"
          # The package declares its executables via directories.bin, which not every npm
          # release links into node_modules/.bin; hand the packaged script to the policy
          # through its absolute-path override instead of widening PATH.
          bats_bin="$RUNNER_TEMP/node_modules/bats/bin"
          [ -x "$bats_bin/bats" ] || { echo "Pinned Bats executable missing after install."; exit 1; }
          echo "BATS_EXECUTABLE=$bats_bin/bats" >> "$GITHUB_ENV"
          [ "$("$bats_bin/bats" --version)" = "Bats 1.13.0" ]

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hosted-bats-apple-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-bats-bin

      - name: Validate hosted Bats binary artifact
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hosted-bats-bin"
          shasum -a 256 -c apple.sha256
          chmod 755 apple
          echo "APPLE_CLI_TEST_BINARY=$RUNNER_TEMP/hosted-bats-bin/apple" >> "$GITHUB_ENV"
          echo "APPLE_CLI_UPSTREAM_ROOT=$RUNNER_TEMP/hosted-bats-bin/upstream-root" >> "$GITHUB_ENV"

      - name: Run hosted Bats quality (pull request)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/trusted-policy/scripts/ci/quality.py" \
            --mode hosted \
            --hosted-context pull-request \
            --hosted-phase bats \
            --candidate-root "$GITHUB_WORKSPACE" \
            --candidate-sha "${{ github.event.pull_request.head.sha }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}"

      - name: Run hosted Bats quality (trusted ref)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          python3 scripts/ci/quality.py \
            --mode hosted \
            --hosted-context trusted-ref \
            --hosted-phase bats \
            --candidate-root "$GITHUB_WORKSPACE" \
            --candidate-sha "${{ github.sha }}"

      # The base-owned quality driver runs the hosted-safe Bats partition only.
      # The local and live/TCC tiers remain forbidden on fork-reachable runners.

  # The release workflow (release.yml) computes bump levels from Conventional Commit
  # headers, so malformed headers silently corrupt version math. This job hard-fails
  # any pushed commit whose subject is not Conventional (git-mechanical forms exempt).
  commit-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Validate Conventional Commit headers
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          SUBJECTS="$RUNNER_TEMP/subjects.txt"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -z "$BASE_SHA" ] || ! git rev-parse --verify --quiet "${BASE_SHA}^{commit}" >/dev/null; then
              echo "Exact pull-request base commit is unavailable."
              exit 1
            fi
            git log --format=%s "${BASE_SHA}..HEAD" > "$SUBJECTS"
          elif [ -n "$BEFORE_SHA" ] && ! echo "$BEFORE_SHA" | grep -qE '^0+$' \
               && git rev-parse --verify --quiet "${BEFORE_SHA}^{commit}" >/dev/null; then
            git log --format=%s "${BEFORE_SHA}..HEAD" > "$SUBJECTS"
          else
            # force-push / initial push: bounded recent window (never a range that can fail)
            git log --format=%s -n 20 HEAD > "$SUBJECTS"
          fi
          BAD=0
          while IFS= read -r subj; do
            [ -n "$subj" ] || continue
            if echo "$subj" | grep -qE '^(Merge |Revert "|fixup!|squash!|amend!|WIP)'; then continue; fi
            if ! echo "$subj" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .{1,}$'; then
              echo "NOT CONVENTIONAL: $subj"; BAD=1
            fi
          done < "$SUBJECTS"
          [ "$BAD" = "0" ] || { echo "Commit headers must follow Conventional Commits (release.yml depends on them)."; exit 1; }

  quality-required:
    name: quality / required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - supply-chain-policy
      - build-test
      - hosted-bats-build
      - hosted-bats
      - commit-lint
    steps:
      - name: Require mandatory quality jobs
        env:
          SUPPLY_CHAIN_POLICY_RESULT: ${{ needs.supply-chain-policy.result }}
          BUILD_TEST_RESULT: ${{ needs.build-test.result }}
          HOSTED_BATS_BUILD_RESULT: ${{ needs.hosted-bats-build.result }}
          HOSTED_BATS_RESULT: ${{ needs.hosted-bats.result }}
          COMMIT_LINT_RESULT: ${{ needs.commit-lint.result }}
        run: |
          set -euo pipefail
          [ "$SUPPLY_CHAIN_POLICY_RESULT" = "success" ] || { echo "supply-chain-policy failed"; exit 1; }
          [ "$BUILD_TEST_RESULT" = "success" ] || { echo "build-test failed"; exit 1; }
          [ "$HOSTED_BATS_BUILD_RESULT" = "success" ] || { echo "hosted-bats-build failed"; exit 1; }
          [ "$HOSTED_BATS_RESULT" = "success" ] || { echo "hosted-bats failed"; exit 1; }
          [ "$COMMIT_LINT_RESULT" = "success" ] || { echo "commit-lint failed"; exit 1; }
