name: Docs

# Keeps the manual honest and release notes inspected.
#
#  - manual-fresh : the manual is GENERATED from the binary's own help dump, so a
#                   command/flag/abstract change that is not regenerated makes the
#                   docs a lie. This turns "the docs match the binary" into a red
#                   build rather than a follow-up task.
#  - release-notes: advisory because an empty [Unreleased] is normal between
#                   releases, so failing CI on it would be noise.
#  - release-prep-rehearsal: the read-only exact-SHA release-preparation rehearsal
#                   (design section 14.1; a smoke check toward section 18 step 15,
#                   whose explicit-SHA evidence binding is separate) run against the
#                   commit this workflow builds — the pushed commit on main, or the
#                   pull request's merge commit — in a throwaway clone. Only the
#                   script's NOTHING-TO-RELEASE status (exit 3: no commits since the
#                   last tag, or an empty [Unreleased], both normal right after a
#                   release) is advisory, for the same reason release-notes is. A
#                   checked failure (exit 1: drift, a malformed CHANGELOG, a stray
#                   manual link, git or I/O trouble) or a refused invocation (exit 2)
#                   fails the job, so a real regression cannot hide behind the
#                   advisory case. It covers the default-bump path only; the
#                   macOS-adoption shape (--macos-major) is exercised locally before a
#                   cut. It writes only into RUNNER_TEMP, has no secrets, uploads
#                   nothing (the scratch copies carry the predicted version and are
#                   never an artifact), and prints only the value-free report; the
#                   predicted version appears in the run log labelled UNASSIGNED, as
#                   section 14.1 permits.
#  - site-assembly-rehearsal: the read-only complete-site assembly rehearsal (design
#                   section 16 / section 18 step 16) run against the same commit in a
#                   throwaway clone: the pinned MkDocs toolchain is installed from
#                   docs/requirements.txt with hashes required, the published release set
#                   is read from the PUBLIC Releases listing without any token (the
#                   unauthenticated listing returns no drafts and flags prereleases), the
#                   candidate's pending version is derived the way release preparation
#                   does and is never printed, the site is assembled into RUNNER_TEMP,
#                   packed, restored and digest-checked, and only the value-free report
#                   reaches the log. The site host stays disabled; nothing is uploaded or deployed.
#                   A rate-limited listing read (HTTP 429, or 403 with the rate-limit
#                   header at zero, from the shared runner IP) is an environmental
#                   WARNING and the assembly does not run — a run with that warning is
#                   not rehearsal evidence; every other failure fails the job. On
#                   pull_request the job runs the PROPOSAL's own copy of the assembler and
#                   toolchain manifest, so it is a smoke check there; the evidence runs are
#                   the push runs on main. NOTE: this job reads the repository's Releases
#                   page, so publishing a Release is an input to CI: a published Release
#                   whose tag is not strict vMAJOR.MINOR.PATCH, or whose commit carries no
#                   tracked docs/manual tree (the v26.0.0 commit predates the manual), turns
#                   this job red on every later commit until the Release is fixed.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manual-fresh:
    runs-on: macos-15
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the binary (the manual's source of truth)
        run: swift build

      - name: Manual matches the binary
        run: |
          python3 scripts/gen-manual.py --check || {
            echo "::error::The manual is stale or has dangling links."
            echo "Regenerate with: python3 scripts/gen-manual.py"
            echo "Never hand-edit docs/manual/ — see AGENTS.md."
            exit 1
          }

  release-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0       # macOS-floor comparison needs the last tag
          persist-credentials: false

      - name: Release-notes contract (advisory)
        continue-on-error: true
        run: python3 scripts/check-release-notes.py

  release-prep-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0       # the rehearsal needs the reachable release tags
          persist-credentials: false

      - name: Read-only release-preparation rehearsal (nothing-to-release advisory)
        env:
          PUSHED_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A throwaway clone keeps the rehearsal off the checkout (design 14.1: a fresh
          # tree or isolated scratch clone). Nothing under RUNNER_TEMP is uploaded, and
          # the scratch copies (which carry the predicted version) go on every exit.
          trap 'rm -rf "$RUNNER_TEMP/release-prep-scratch" "$RUNNER_TEMP/candidate"' EXIT
          git clone --quiet --no-hardlinks "$GITHUB_WORKSPACE" "$RUNNER_TEMP/candidate"
          CANDIDATE_SHA="$(git -C "$RUNNER_TEMP/candidate" rev-parse HEAD)"
          if [ "$EVENT_NAME" = push ] && [ "$CANDIDATE_SHA" != "$PUSHED_SHA" ]; then
            echo "::error::checked-out commit does not equal the pushed commit"; exit 1
          fi
          # On pull_request the checkout is the synthetic merge commit, whose id can lag
          # github.sha; the clone's HEAD is the commit that was actually built.
          set +e
          python3 -I -S -B scripts/ci/release_prep.py \
            --candidate-root "$RUNNER_TEMP/candidate" \
            --candidate-sha "$CANDIDATE_SHA" \
            --repository "$REPOSITORY" \
            --scratch "$RUNNER_TEMP/release-prep-scratch"
          status=$?
          set -e
          case "$status" in
            0) ;;
            3) echo "::notice::release-prep: nothing to release at this commit (normal right after a release)" ;;
            *) echo "::error::release-prep rehearsal failed (exit $status); see the log"; exit "$status" ;;
          esac

  site-assembly-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0       # the assembly needs the reachable release tags
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the pinned documentation toolchain
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r docs/requirements.txt

      - name: Read the public Releases listing (no token)
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          status="$(curl -sS --proto '=https' --tlsv1.2 --max-time 60 --retry 5 --retry-delay 5 --retry-all-errors -D "$RUNNER_TEMP/releases.headers" -o "$RUNNER_TEMP/releases.json" -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/releases?per_page=100")"
          limited=no
          if [ "$status" = 429 ]; then limited=yes; fi
          # Primary limits answer 403 with the remaining count at zero; secondary limits answer 403
          # with a retry-after header. Any other 403 is a real failure. curl -D appends the headers
          # of every retry attempt, so only the FINAL response's header block is classified.
          final_headers="$(awk 'BEGIN{RS="\r\n\r\n"} NF{last=$0} END{print last}' "$RUNNER_TEMP/releases.headers")"
          if [ "$status" = 403 ] && printf '%s\n' "$final_headers" | grep -qiE '^(x-ratelimit-remaining: 0|retry-after:)'; then limited=yes; fi
          if [ "$status" = 200 ]; then
            echo run > "$RUNNER_TEMP/releases.status"
          elif [ "$limited" = yes ]; then
            echo skip > "$RUNNER_TEMP/releases.status"
            echo "::warning::site-assembly: the public Releases listing is rate-limited from this runner; the rehearsal did NOT run and this run is not rehearsal evidence"
          else
            echo "::error::site-assembly: the public Releases listing returned HTTP $status"; exit 1
          fi

      - name: Read-only complete-site assembly rehearsal
        env:
          PUSHED_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          trap 'rm -rf "$RUNNER_TEMP/site-scratch" "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/releases.headers" "$RUNNER_TEMP/releases.status" "$RUNNER_TEMP/site-report.json"' EXIT
          if [ ! -f "$RUNNER_TEMP/releases.status" ] || [ "$(cat "$RUNNER_TEMP/releases.status")" != run ]; then
            echo "site-assembly: NOT RUN (listing unavailable)"; exit 0
          fi
          git clone --quiet --no-hardlinks "$GITHUB_WORKSPACE" "$RUNNER_TEMP/candidate"
          CANDIDATE_SHA="$(git -C "$RUNNER_TEMP/candidate" rev-parse HEAD)"
          if [ "$EVENT_NAME" = push ] && [ "$CANDIDATE_SHA" != "$PUSHED_SHA" ]; then
            echo "::error::checked-out commit does not equal the pushed commit"; exit 1
          fi
          RENDERER="$(python -c 'import shutil, sys; print(shutil.which("mkdocs") or sys.exit(1))')"
          python3 -I -S -B scripts/ci/site_assembly.py \
            --candidate-root "$RUNNER_TEMP/candidate" \
            --candidate-sha "$CANDIDATE_SHA" \
            --derive-candidate-version \
            --published-from-json "$RUNNER_TEMP/releases.json" \
            --renderer "$RENDERER" \
            --scratch "$RUNNER_TEMP/site-scratch" \
            --report "$RUNNER_TEMP/site-report.json"
          cat "$RUNNER_TEMP/site-report.json"
