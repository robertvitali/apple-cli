<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="apple">
  <title>apple</title>
  <!-- Generic apple fruit: two lobes meeting in a dip, a stem, and a leaf.
       Intentionally a plain piece of fruit and not any company's device mark. -->
  <g fill="currentColor">
    <!-- body: left and right lobes joined, with the characteristic top dip -->
    <path d="M32 22c-3.6-4.6-9.8-5.8-15-2.6C10.4 23.6 8.4 32 11.6 40.4c2.6 7 7.2 15.6 12.4 15.6 3 0 4.6-2.1 8-2.1s5 2.1 8 2.1c5.2 0 9.8-8.6 12.4-15.6 3.2-8.4 1.2-16.8-5.4-21C41.8 16.2 35.6 17.4 32 22z"/>
    <!-- stem -->
    <rect x="30" y="6" width="4.2" height="14" rx="2.1"/>
    <!-- leaf -->
    <ellipse cx="43" cy="12.5" rx="9.5" ry="5.2" transform="rotate(-24 43 12.5)"/>
  </g>
</svg>
